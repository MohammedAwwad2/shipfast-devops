name: ShipFast CI Pipeline


on:
  workflow_dispatch: 
    inputs:
      node-version:
        description: 'Node.js version'
        type: string
        default: '24'
      environoment:
        description: "choose env to deploy in "
        type: choice
        options:
          - dev
          - prod
          - uat
          - sit
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read  

#       
#What does a job that only tests the code need?
env:
  REGISTRY: ghcr.io
  IMAGE: shipfast-app
# TODO: Define the image name. It must be lowercase.
jobs:
  env:
    runs-on: ubuntu-22.04
    steps:  
      - name: Print message
        run: echo " the env u are in is ${{inputs.environoment}}"
  test:
    uses: MohammedAwwad2/shipfast-devops/.github/workflows/reusable-test.yaml@main
    with:
      Node-v: ${{ inputs.node-version }}
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-24.04
    needs: test
    if: github.event_name == 'push'   
    permissions:
      packages: write
    outputs:
      image: ${{ steps.image-ref.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}     
      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image reference
        id: image-ref
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "ref=${{ env.REGISTRY }}/$OWNER/${{ env.IMAGE }}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  update-manifest:
    name: Write image tag to Git
    runs-on: ubuntu-24.04
    needs: build-and-push
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Set image in deployment.yaml
        run: |
          yq -i '.spec.template.spec.containers[0].image = "${{ needs.build-and-push.outputs.image }}"' k8s/base/deployment.yaml
          grep -n "image:" k8s/base/deployment.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet k8s/base/deployment.yaml; then
            echo "Image tag already current. Nothing to commit."
            exit 0
          fi
          git add k8s/base/deployment.yaml
          git commit -m "chore: deploy ${{ needs.build-and-push.outputs.image }} [skip ci]"
          git push origin main
