name: ShipFast CI Pipeline


on:
  workflow_dispatch: 
    inputs:
      node-version:
        description: 'Node.js version'
        type: string
        default: '24'
      environoment:
        description: "choose env to deploy in "
        type: choice
        options:
          - dev
          - prod
          - uat
          - sit
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read  

#       
#What does a job that only tests the code need?
env:
  REGISTRY: ghcr.io
  IMAGE: shipfast-app
# TODO: Define the image name. It must be lowercase.
jobs:
  env:
    runs-on: ubuntu-22.04
    steps:  
      - name: Print message
        run: echo " the env u are in is ${{inputs.environoment}}"
  test:
    uses: MohammedAwwad2/shipfast-devops/.github/workflows/reusable-test.yaml@main
    with:
      Node-v: ${{ inputs.node-version }}
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-24.04
    needs: test
    if: github.event_name == 'push'   
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}     
      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
