replicaCount: 2

image:
  repository: ghcr.io/mohammedawwad2/shipfast-app
  tag: "1.0.0"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

service:
  type: NodePort
  port: 80
  nodePort: 30080

containerPort: 3000

env:
  nodeEnv: production
