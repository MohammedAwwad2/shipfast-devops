---
- name: Configure ShipFast host
  hosts: shipfast
  become: true
  vars:
    app_dir: /opt/shipfast-app
    app_user: shipfast
    app_port: 3000
    app_src: "{{ playbook_dir }}/../../app"
    app_description: ShipFast application
    app_directory: "{{ app_dir }}"
    app_command: "/usr/bin/env PORT={{ app_port }} /usr/bin/node {{ app_dir }}/index.js"

  tasks:
    - name: Ensure Node.js and npm are installed
      ansible.builtin.apt:
        name:
          - nodejs
          - npm
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure service user exists
      ansible.builtin.user:
        name: "{{ app_user }}"
        system: true
        shell: /usr/sbin/nologin
        create_home: false

    - name: Ensure app directory exists
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: Copy application files
      ansible.builtin.copy:
        src: "{{ app_src }}/{{ item }}"
        dest: "{{ app_dir }}/{{ item }}"
        mode: "0644"
      loop:
        - index.js
        - package.json
        - package-lock.json
      notify: Restart shipfast

    - name: Copy static assets
      ansible.builtin.copy:
        src: "{{ app_src }}/public/"
        dest: "{{ app_dir }}/public/"
        mode: "0644"
        directory_mode: "0755"
      notify: Restart shipfast

    - name: Install production dependencies
      ansible.builtin.command:
        cmd: npm ci --omit=dev
        chdir: "{{ app_dir }}"
        creates: "{{ app_dir }}/node_modules"
      notify: Restart shipfast

    - name: Install systemd unit file
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/shipfast.service.j2"
        dest: /etc/systemd/system/shipfast.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart shipfast

    - name: Apply pending restarts before checking state
      ansible.builtin.meta: flush_handlers

    - name: Ensure service is enabled and running
      ansible.builtin.systemd:
        name: shipfast
        enabled: true
        state: started

    - name: Verify health endpoint responds
      ansible.builtin.uri:
        url: "http://localhost:{{ app_port }}/health"
        method: GET
        status_code: 200
      register: health_check
      retries: 5
      delay: 2
      until: health_check.status == 200
      changed_when: false

  handlers:
    - name: Restart shipfast
      ansible.builtin.systemd:
        name: shipfast
        state: restarted
        daemon_reload: true
